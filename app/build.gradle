plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    // Signing from local.properties — do not hardcode passwords in the repo
    def keystorePath = localProps.getProperty("KEYSTORE_FILE", "")
    if (keystorePath) {
        signingConfigs {
            debug {
                storeFile file(keystorePath)
                storePassword localProps.getProperty("KEYSTORE_PASSWORD", "")
                keyAlias localProps.getProperty("KEY_ALIAS", "key0")
                keyPassword localProps.getProperty("KEY_PASSWORD", "")
            }
        }
    }
    namespace 'com.example.minipaneldemo'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.hallmond"
        minSdk 23
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // PACKAGE_NAME: thingsmart-personal-message deep link host
        // AppKey / AppSecret: from local.properties
        manifestPlaceholders = [
                PACKAGE_NAME      : applicationId,
                TUYA_SMART_APPKEY : localProps.getProperty("appKey", ""),
                TUYA_SMART_SECRET : localProps.getProperty("appSecret", "")
        ]

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }
    packagingOptions {
        jniLibs {
            pickFirsts += ['lib/*/liblog.so', 'lib/*/libc++_shared.so', 'lib/*/libyuv.so', 'lib/*/libopenh264.so', 'lib/*/libv8wrapper.so', 'lib/*/libv8android.so']
        }
    }
    packaging {
        resources {
            excludes += "META-INF/INDEX.LIST"
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        compose true
    }
    lint {
        abortOnError false
    }
}

